<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- 🔥 MOST IMPORTANT FOR MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gagan Gyaan</title>

<style>
:root {
    --yellow: #f5d76e;
    --dark-brown: #6d4c41;
    --mid-brown: #8d6e63;
    --light: #fff6d5;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--yellow);
    color: #3e2723;
    font-size: 16px;
}

h1 {
    text-align: center;
    margin-bottom: 4px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    margin-bottom: 28px;
    font-size: 15px;
    opacity: 0.8;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* INPUT PANEL */
.input-panel {
    background: var(--mid-brown);
    padding: 24px;
    border-radius: 18px;
    margin-bottom: 32px;
}

.input-panel input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    background: var(--light);
}

.input-panel button {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: #fbc02d;
    color: #4e342e;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
}

.input-panel button:hover {
    background: #f9a825;
}

/* SUBJECT CARDS */
.subjects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
}

.subject-card {
    background: var(--light);
    border-radius: 18px;
    padding: 20px;
    position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

.subject-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 12px;
}

.stat {
    font-size: 15px;
    margin: 6px 0;
}

/* DELETE SUBJECT */
.delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    border: none;
    background: #c62828;
    color: white;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 16px;
}

/* DROPDOWN */
.toggle-btn {
    margin-top: 12px;
    background: #6d4c41;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
}

.days {
    margin-top: 12px;
    display: none;
}

.day-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 8px 10px;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 14px;
}

.day-row button {
    border: none;
    background: #d32f2f;
    color: white;
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
}

/* 📱 MOBILE OPTIMIZATION */
@media (max-width: 480px) {

    body {
        padding: 16px;
        font-size: 17px;
    }

    h1 {
        font-size: 26px;
    }

    .subtitle {
        font-size: 15px;
    }

    .input-panel {
        padding: 20px;
    }

    .input-panel input {
        font-size: 17px;
        padding: 16px;
    }

    .input-panel button {
        font-size: 18px;
        padding: 18px;
    }

    .subjects {
        grid-template-columns: 1fr;
    }

    .subject-title {
        font-size: 21px;
    }

    .stat {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<h1>📚 Gagan Gyaan</h1>
<div class="subtitle">ज्ञान • अनुशासन • निरंतर अभ्यास</div>

<div class="container">

    <!-- INPUT -->
    <div class="input-panel">
        <input id="subject" placeholder="Subject name">
        <input id="date" type="date">
        <input id="hours" type="number" placeholder="Hours" min="0">
        <input id="minutes" type="number" placeholder="Minutes" min="0" max="59">
        <input id="mustCover" type="number" placeholder="Must time (minutes)">
        <button onclick="addStudy()">Add Study Session</button>
    </div>

    <!-- SUBJECTS -->
    <div class="subjects" id="subjectsContainer"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    let data = JSON.parse(localStorage.getItem("studyData")) || {};

    const subjectEl = document.getElementById("subject");
    const dateEl = document.getElementById("date");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const mustCoverEl = document.getElementById("mustCover");
    const container = document.getElementById("subjectsContainer");

    dateEl.valueAsDate = new Date();

    function save() {
        localStorage.setItem("studyData", JSON.stringify(data));
    }

    window.addStudy = function () {
        const name = subjectEl.value.trim();
        const key = name.toLowerCase();
        const date = dateEl.value;

        const mins =
            (+hoursEl.value || 0) * 60 +
            (+minutesEl.value || 0);

        const safeMins = Math.max(0, mins);
        const must = +mustCoverEl.value;

        // ✅ allow 0 minutes, block only negative
        if (!name || !date || mins < 0) {
            alert("Please enter valid subject and date");
            return;
        }

        if (!data[key]) {
            data[key] = { name, mustCover: must || 0, sessions: {} };
        }

        if (!isNaN(must)) data[key].mustCover = must;

        data[key].sessions[date] =
            (data[key].sessions[date] || 0) + safeMins;

        save();
        render();

        hoursEl.value = "";
        minutesEl.value = "";
    };

    window.deleteSubject = function (key) {
        if (confirm(`Delete "${data[key].name}"?`)) {
            delete data[key];
            save();
            render();
        }
    };

    window.deleteDay = function (key, date) {
        if (confirm(`Delete data for ${date}?`)) {
            delete data[key].sessions[date];
            if (Object.keys(data[key].sessions).length === 0) {
                delete data[key];
            }
            save();
            render();
        }
    };

    window.toggleDays = function (id, btn) {
        const el = document.getElementById(id);
        const open = el.style.display === "block";
        el.style.display = open ? "none" : "block";
        btn.textContent = open ? "Show Daily Data ▼" : "Hide Daily Data ▲";
    };

    function render() {
        container.innerHTML = "";

        for (let key in data) {
            const entries = Object.entries(data[key].sessions);
            let total = 0, max = 0, achieved = 0;

            entries.forEach(([_, v]) => {
                total += v;
                max = Math.max(max, v);
                if (v >= data[key].mustCover) achieved++;
            });

            const avg = entries.length
                ? Math.round(total / entries.length)
                : 0;

            const daysId = "days_" + key;

            let daysHTML = "";
            entries.forEach(([date, mins]) => {
                daysHTML += `
                    <div class="day-row">
                        <span>📅 ${date} — ${format(mins)}</span>
                        <button onclick="deleteDay('${key}','${date}')">✕</button>
                    </div>
                `;
            });

            container.innerHTML += `
                <div class="subject-card">
                    <button class="delete-btn" onclick="deleteSubject('${key}')">×</button>
                    <div class="subject-title">${data[key].name}</div>
                    <div class="stat"><b>Max Time:</b> ${format(max)}</div>
                    <div class="stat"><b>Average Time:</b> ${format(avg)}</div>
                    <div class="stat"><b>Must Time:</b> ${data[key].mustCover} min</div>
                    <div class="stat"><b>Must Time Achieved:</b> ${achieved}</div>
                    <button class="toggle-btn" onclick="toggleDays('${daysId}', this)">
                        Show Daily Data ▼
                    </button>
                    <div class="days" id="${daysId}">
                        ${daysHTML}
                    </div>
                </div>
            `;
        }
    }

    function format(min) {
        return `${Math.floor(min / 60)} hr ${min % 60} min`;
    }

    render();
});
</script>

</body>
</html>

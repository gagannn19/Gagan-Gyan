<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gagan Gyaan</title>
    <!-- change 3 -->

<style>
:root {
    --yellow: #f5d76e;
    --dark-brown: #6d4c41;
    --mid-brown: #8d6e63;
    --light: #fff6d5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--yellow);
    color: #3e2723;
}

h1 {
    text-align: center;
    margin-bottom: 4px;
}

.subtitle {
    text-align: center;
    margin-bottom: 28px;
    font-size: 14px;
    opacity: 0.8;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* INPUT PANEL */
.input-panel {
    background: var(--mid-brown);
    padding: 24px;
    border-radius: 16px;
    margin-bottom: 32px;
}

.input-panel input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    background: var(--light);
}

.input-panel button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #fbc02d;
    color: #4e342e;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.input-panel button:hover {
    background: #f9a825;
}

/* SUBJECT CARDS */
.subjects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.subject-card {
    background: var(--light);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

.subject-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
}

.stat {
    font-size: 14px;
    margin: 6px 0;
}

/* DELETE */
.delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    border: none;
    background: #c62828;
    color: white;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    cursor: pointer;
    font-size: 14px;
}

.delete-btn:hover {
    background: #b71c1c;
}

/* MOBILE */
@media (max-width: 600px) {
    body {
        padding: 16px;
    }
}
</style>
</head>

<body>

<h1>📚 Gagan Gyaan</h1>
<div class="subtitle">ज्ञान • अनुशासन • निरंतर अभ्यास</div>

<div class="container">

    <!-- INPUT -->
    <div class="input-panel">
        <input id="subject" placeholder="Subject name">
        <input id="date" type="date">
        <input id="hours" type="number" placeholder="Hours" min="0">
        <input id="minutes" type="number" placeholder="Minutes" min="0" max="59">
        <input id="mustCover" type="number" placeholder="Must time (minutes)">
        <button onclick="addStudy()">Add Study Session</button>
    </div>

    <!-- SUBJECTS -->
    <div class="subjects" id="subjectsContainer"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    let data = JSON.parse(localStorage.getItem("studyData")) || {};

    const subjectEl = document.getElementById("subject");
    const dateEl = document.getElementById("date");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const mustCoverEl = document.getElementById("mustCover");
    const container = document.getElementById("subjectsContainer");

    dateEl.valueAsDate = new Date();

    function save() {
        localStorage.setItem("studyData", JSON.stringify(data));
    }

    window.addStudy = function () {
        const name = subjectEl.value.trim();
        const key = name.toLowerCase();
        const date = dateEl.value;
        const minutes = (+hoursEl.value || 0) * 60 + (+minutesEl.value || 0);
        const must = +mustCoverEl.value;

        if (!name || !date || minutes <= 0) {
            alert("Please enter valid subject, date and time");
            return;
        }

        if (!data[key]) {
            data[key] = { name, mustCover: must || 0, sessions: {} };
        }

        if (Array.isArray(data[key].sessions)) {
            data[key].sessions = {};
        }

        if (!isNaN(must)) data[key].mustCover = must;

        data[key].sessions[date] =
            (data[key].sessions[date] || 0) + minutes;

        save();
        render();

        hoursEl.value = "";
        minutesEl.value = "";
    };

    window.deleteSubject = function (key) {
        if (confirm(`Delete "${data[key].name}"?`)) {
            delete data[key];
            save();
            render();
        }
    };

    function render() {
        container.innerHTML = "";

        for (let key in data) {
            const days = Object.values(data[key].sessions);
            let total = 0, max = 0, achieved = 0;

            days.forEach(d => {
                total += d;
                max = Math.max(max, d);
                if (d >= data[key].mustCover) achieved++;
            });

            const avg = days.length ? Math.round(total / days.length) : 0;

            container.innerHTML += `
                <div class="subject-card">
                    <button class="delete-btn" onclick="deleteSubject('${key}')">×</button>
                    <div class="subject-title">${data[key].name}</div>
                    <div class="stat"><b>Max Time:</b> ${format(max)}</div>
                    <div class="stat"><b>Average Time:</b> ${format(avg)}</div>
                    <div class="stat"><b>Must Time:</b> ${data[key].mustCover} min</div>
                    <div class="stat"><b>Must Time Achieved:</b> ${achieved}</div>
                </div>
            `;
        }
    }

    function format(min) {
        return `${Math.floor(min / 60)} hr ${min % 60} min`;
    }

    render();
});
</script>

</body>
</html>

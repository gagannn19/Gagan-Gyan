<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gagan Gyaan</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5d76e;
    margin: 0;
    padding: 24px;
    color: #4e342e;
}

h1, h2 {
    text-align: center;
    margin-bottom: 10px;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* INPUT AREA */
.input-box {
    background: #8d6e63;
    padding: 24px;
    border-radius: 14px;
    margin-bottom: 30px;
}

.input-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    background: #fff8dc;
}

.input-box button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    background: #fbc02d;
    color: #4e342e;
    cursor: pointer;
}

.input-box button:hover {
    background: #f9a825;
}

/* SUBJECT CARD */
.subject-card {
    background: #fff3cd;
    padding: 20px 24px;
    border-radius: 14px;
    margin-bottom: 18px;
    border-left: 6px solid #6d4c41;
    position: relative;
}

.subject-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 10px;
}

.stat {
    margin: 6px 0;
    font-size: 15px;
}

/* DELETE BUTTON */
.delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #c62828;
    color: #fff;
    border: none;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
}

.delete-btn:hover {
    background: #b71c1c;
}
</style>
</head>

<body>

<h1>📚 Gagan Gyaan</h1>
<h2>ज्ञान • अनुशासन • निरंतर अभ्यास</h2>

<div class="container">

    <!-- INPUT -->
    <div class="input-box">
        <input id="subject" placeholder="Subject Name">
        <input id="date" type="date">
        <input id="hours" type="number" placeholder="Hours" min="0">
        <input id="minutes" type="number" placeholder="Minutes" min="0" max="59">
        <input id="mustCover" type="number" placeholder="Must Cover Time (minutes)">
        <button onclick="addStudy()">Add Study Session</button>
    </div>

    <!-- SUBJECTS -->
    <div id="subjectsContainer"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("studyData")) || {};

function addStudy() {
    const subject = document.getElementById("subject").value.trim();
    const date = document.getElementById("date").value;
    const hours = parseInt(document.getElementById("hours").value) || 0;
    const minutes = parseInt(document.getElementById("minutes").value) || 0;
    const must = parseInt(document.getElementById("mustCover").value);

    const totalMinutes = hours * 60 + minutes;

    if (!subject || !date || totalMinutes <= 0) {
        alert("Please enter subject, date, and valid time");
        return;
    }

    if (!data[subject]) {
        data[subject] = {
            mustCover: must || 0,
            sessions: {} // date-wise
        };
    }

    if (!isNaN(must)) {
        data[subject].mustCover = must;
    }

    // SAME SUBJECT + SAME DATE → ADD
    if (data[subject].sessions[date]) {
        data[subject].sessions[date] += totalMinutes;
    } else {
        data[subject].sessions[date] = totalMinutes;
    }

    localStorage.setItem("studyData", JSON.stringify(data));

    // clear inputs
    document.getElementById("hours").value = "";
    document.getElementById("minutes").value = "";

    renderSubjects();
}

function deleteSubject(subject) {
    if (confirm(`Delete "${subject}"?`)) {
        delete data[subject];
        localStorage.setItem("studyData", JSON.stringify(data));
        renderSubjects();
    }
}

function renderSubjects() {
    const container = document.getElementById("subjectsContainer");
    container.innerHTML = "";

    for (let subject in data) {
        const days = Object.values(data[subject].sessions);
        let total = 0;
        let max = 0;
        let achieved = 0;
        const must = data[subject].mustCover;

        days.forEach(m => {
            total += m;
            if (m > max) max = m;
            if (m >= must) achieved++;
        });

        const avg = days.length ? Math.round(total / days.length) : 0;

        container.innerHTML += `
            <div class="subject-card">
                <button class="delete-btn" onclick="deleteSubject('${subject}')">✕</button>
                <div class="subject-title">${subject}</div>
                <div class="stat"><b>Max Time:</b> ${format(max)}</div>
                <div class="stat"><b>Average Time:</b> ${format(avg)}</div>
                <div class="stat"><b>Must Time:</b> ${must} min</div>
                <div class="stat"><b>Must Time Achieved:</b> ${achieved}</div>
            </div>
        `;
    }
}

function format(min) {
    return `${Math.floor(min / 60)} hr ${min % 60} min`;
}

renderSubjects();
</script>

</body>
</html>
